models:
  - name: stg_stripe_payments        # ← must match the .sql model name
    description: Staged payment data from Stripe
    columns:
      - name: payment_id
        description: Primary key for payments
        tests:
          - unique
          - not_null

      - name: amount
        description: Total amount of the payment (in cents)

      - name: status
        description: "{{ doc('payment_status') }}"

models:
  - name: stg_customers
    description: The grain of this table is one unique customer per row
    columns:
      - name: customer_id
        description: Primary key for the customers table
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: One order per row
    columns:
      - name: order_id
        description: primary key for the orders table
        tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending

      - name: customer_id
        tests:
          - relationships:
             arguments: 
               field: customer_id
               to: ref('stg_customers')


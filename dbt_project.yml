name: "bbaggins_dbt_quickstart"
version: "1.0"
config-version: 2

profile: "default"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  bbaggins_dbt_quickstart:
    +database: RAW
    +schema: DBT_KLAING

    staging:
      +materialized: view

    marts:
      +materialized: table

    # --- Mortgage Calculator ---
    mortgage:
      +schema: DBT_KLAING_MTG
      staging:
        +materialized: view
      marts:
        +materialized: view

# Global defaults for seeds (safety net)
seeds:
  +database: RAW
  +schema: SEEDS
  bbaggins_dbt_quickstart:
    +database: RAW
    +schema: SEEDS

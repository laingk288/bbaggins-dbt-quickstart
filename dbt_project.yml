name: "bbaggins_dbt_quickstart"
version: "1.0"
config-version: 2

profile: "default"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  bbaggins_dbt_quickstart:
    +database: ANALYTICS
    +schema: DBT_KLAING         # legacy/jaffle models land here

    staging:
      +materialized: view

    marts:
      +materialized: table

    # --- Mortgage Calculator ---
    mortgage:
      +schema: DBT_KLAING_MTG   # mortgage models land here
      staging:
        +materialized: view
      marts:
        +materialized: view

seeds:
  +database: RAW                 # global default (extra safety)
  +schema: SEEDS
  bbaggins_dbt_quickstart:
    +database: RAW               # project-specific (what dbt will use)
    +schema: SEEDS
